services:
  # ─────────────────────────── Инфраструктура обмена сообщениями ───────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: eventapi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: eventapi-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # Внешний listener для подключения с хоста (например, из dotnet run локально).
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Два listener'а: INTERNAL — для сервисов внутри сети Docker, EXTERNAL — для хоста.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # ─────────────────────────── Базы данных (по одной на сервис) ───────────────────────────
  users-db:
    image: postgres:16
    container_name: eventapi-users-db
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  events-db:
    image: postgres:16
    container_name: eventapi-events-db
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookings-db:
    image: postgres:16
    container_name: eventapi-bookings-db
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: eventapi-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────── Сервисы ───────────────────────────
  users-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PROJECT: TicketFlow.Users.Presentation/TicketFlow.Users.Presentation.csproj
        SERVICE_DLL: TicketFlow.Users.Presentation.dll
    container_name: eventapi-users-service
    depends_on:
      users-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=users-db;Port=5432;Database=users;Username=postgres;Password=postgres"
      Jwt__Issuer: TicketFlow
      Jwt__Audience: TicketFlowClient
      Jwt__ExpirationMinutes: "60"
      Jwt__Secret: "037048d666b378eb0147eec79ccd91b8e016e23fb5d9f5a131855bf94ef3fb8d"
    ports:
      - "5101:8080"

  events-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PROJECT: TicketFlow.Events.Presentation/TicketFlow.Events.Presentation.csproj
        SERVICE_DLL: TicketFlow.Events.Presentation.dll
    container_name: eventapi-events-service
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=events-db;Port=5432;Database=events;Username=postgres;Password=postgres"
      Jwt__Issuer: TicketFlow
      Jwt__Audience: TicketFlowClient
      Jwt__ExpirationMinutes: "60"
      Jwt__Secret: "037048d666b378eb0147eec79ccd91b8e016e23fb5d9f5a131855bf94ef3fb8d"
      Kafka__BootstrapServers: kafka:29092
      Kafka__ConsumerGroup: events-service
      Redis__ConnectionString: "redis:6379"
    ports:
      - "5102:8080"

  bookings-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PROJECT: TicketFlow.Bookings.Presentation/TicketFlow.Bookings.Presentation.csproj
        SERVICE_DLL: TicketFlow.Bookings.Presentation.dll
    container_name: eventapi-bookings-service
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=bookings-db;Port=5432;Database=bookings;Username=postgres;Password=postgres"
      Jwt__Issuer: TicketFlow
      Jwt__Audience: TicketFlowClient
      Jwt__ExpirationMinutes: "60"
      Jwt__Secret: "037048d666b378eb0147eec79ccd91b8e016e23fb5d9f5a131855bf94ef3fb8d"
      Kafka__BootstrapServers: kafka:29092
    ports:
      - "5103:8080"

volumes:
  users-db-data:
  events-db-data:
  bookings-db-data:
